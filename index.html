<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>An Lạc Việt 3D</title>
<style>
  :root{--ink:#1f3a2a;--paper:#f8f4ea;--accent:#e07b54}
  html,body{margin:0;height:100%;overflow:hidden;background:#cfe3ee;font-family:system-ui,"Segoe UI",sans-serif;color:var(--ink)}
  #hud{position:fixed;top:0;left:0;right:0;padding:16px 16px 44px;pointer-events:none;background:linear-gradient(rgba(248,244,234,.9),rgba(248,244,234,0));z-index:3}
  #hud h1{margin:0;font-size:clamp(18px,3vw,30px);letter-spacing:.02em}
  #hud p{margin:4px 0 0;opacity:.7;font-size:13px}
  .pin{position:fixed;left:0;top:0;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .45s;
       background:var(--paper);border:2px solid var(--ink);border-radius:999px;min-width:22px;height:22px;padding:0 4px;box-sizing:border-box;
       display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px;font-weight:700;box-shadow:0 3px 8px #0003;white-space:nowrap}
  .pin.on{opacity:1;pointer-events:auto}
  .pin:hover{background:var(--accent);color:#fff;z-index:2}
  .pin .tip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:500;
       padding:4px 8px;border-radius:6px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s}
  .pin:hover .tip{opacity:1}
  .pin.zone{background:var(--ink);color:#fff;height:30px;padding:0 12px 0 10px;font-size:13px}
  .pin.zone b{font-family:Georgia,serif}
  .pin.zone span{font-weight:500;opacity:.9}
  #card{position:fixed;right:16px;bottom:16px;max-width:320px;background:var(--paper);border-radius:14px;padding:16px 18px;z-index:4;
        box-shadow:0 10px 30px #0003;transform:translateY(140%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
  #card.show{transform:none}
  #card h2{margin:0 0 6px;font-size:18px}#card p{margin:0;font-size:13px;opacity:.8}
  #card button{margin-top:10px;border:0;background:var(--ink);color:#fff;border-radius:8px;padding:6px 12px;cursor:pointer}
  #loading{position:fixed;inset:0;display:grid;place-items:center;font-size:14px;opacity:.7;pointer-events:none}
  #ctrl{position:fixed;left:16px;bottom:16px;z-index:4;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
  #ctrl .grp{display:flex;align-items:center;gap:4px;background:rgba(248,244,234,.88);backdrop-filter:blur(6px);border-radius:999px;padding:4px;box-shadow:0 4px 14px #0002}
  #ctrl .grp>span{font-size:11px;opacity:.6;padding:0 6px 0 10px;text-transform:uppercase;letter-spacing:.06em}
  #ctrl button{border:0;background:transparent;color:var(--ink);font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;cursor:pointer}
  #ctrl button:hover{background:#0000000d}
  #ctrl button.on{background:var(--ink);color:#fff}
  #card{z-index:5}
  body.night #hud{background:linear-gradient(rgba(14,22,40,.85),rgba(14,22,40,0));color:#eef2f7}
  @media (max-width:600px){ #ctrl .grp>span{display:none} #ctrl button{font-size:12px;padding:6px 9px} }
</style>
</head>
<body>
<div id="hud"><h1>Khu du lịch sinh thái dưới tán rừng An Lạc Việt</h1><p>Kéo để xoay · cuộn để zoom · bấm vào phân khu hoặc số để xem chi tiết</p></div>
<div id="loading">Đang dựng mô hình…</div>
<div id="pins"></div>
<div id="ctrl">
  <div class="grp" id="gTime"><span>Thời gian</span><button data-v="day" class="on">☀ Ngày</button><button data-v="sunset">🌇 Hoàng hôn</button><button data-v="night">🌙 Đêm</button></div>
  <div class="grp" id="gWx"><span>Thời tiết</span><button data-v="clear" class="on">Nắng ráo</button><button data-v="rain">🌧 Mưa</button><button data-v="mist">🌫 Sương mù</button></div>
  <div class="grp"><button id="music">♪ Bật nhạc &amp; âm thanh</button></div>
</div>
<div id="card"><h2 id="ct"></h2><p id="cd"></p><button id="back">Toàn cảnh</button></div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ================= DỮ LIỆU =================
// Tọa độ pixel theo ảnh mặt bằng có ghi chú (2000x1237). Ảnh nền sạch = vùng CROP của ảnh đó, phóng to.
const LEGEND = {1:'Trung tâm đón khách và văn phòng',2:'Nhà hàng và cửa hàng',3:'Sân chơi trẻ em',4:'Nhà câu lạc bộ',5:'Sân thể thao & hoạt động ngoài trời',6:'Bãi xe',7:'Trạm điều hành khu cắm trại',8:'Trại thuần dưỡng thú',9:'Trạm vườn ươm',10:'Nhà tham quan nông trại sinh thái',11:'Nhà nghỉ nhân viên',12:'Trung tâm spa, yoga, thiền định',13:'Nhà khách 01',14:'Nhà khách 02',15:'Nhà khách 03',16:'Khu nhà hàng',17:'Nhà CLB khu bungalow',18:'Khu nhà hội nghị',19:'Khu kỹ thuật',20:'Khu tập kết rác',21:'Trạm xử lý nước thải',22:'Bãi lều trại',
  I:'Khu làng nghỉ dưỡng dưới tán rừng',II:'Khu dịch vụ du lịch',III:'Khu rừng sinh thái kết hợp tham quan'};
const ZONE_SHORT = {I:'Làng nghỉ dưỡng',II:'Dịch vụ du lịch',III:'Rừng sinh thái'};
const PINS = [[1,964,538],[2,957,456],[3,988,299],[4,899,352],[5,730,453],[5,493,565],[6,843,450],[6,420,565],[6,910,861],[7,822,837],[8,865,1043],[9,289,734],[9,196,977],[10,174,718],[11,153,551],[12,380,672],[13,396,755],[14,461,692],[15,470,767],[16,508,726],[17,362,803],[18,519,820],[19,804,480],[19,436,532],[19,899,583],[20,408,532],[21,212,818],[22,635,790],[22,623,1006],[22,407,1003],[22,751,1030],
  ['I',787,408,1],['I',803,713],['II',307,810,1],['II',348,955],['III',595,967,1],['III',426,1047]];
const CROP = {x:20,y:145,w:1420,h:1065};
const MW = 14.2, MH = 10.65;                                // kích thước sa bàn (đơn vị 3D)
const toWorld = (px,py)=>new THREE.Vector3((px-CROP.x)/CROP.w*MW - MW/2, 0, (py-CROP.y)/CROP.h*MH - MH/2);

// ================= SCENE =================
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = .95;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.fog = new THREE.Fog(0xd6e8ee, 24, 52);
const camera = new THREE.PerspectiveCamera(35, innerWidth/innerHeight, .05, 200);
const HOME = {pos:new THREE.Vector3(0,12,14.5).multiplyScalar(Math.max(1, 1.4/(innerWidth/innerHeight))), tgt:new THREE.Vector3()};
camera.position.copy(HOME.pos);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = 1.35; controls.minDistance = 1.2; controls.maxDistance = 30;

// Ánh sáng kiểu anime: nắng vàng ấm, bóng đổ ngả xanh lam
const hemi = new THREE.HemisphereLight(0xcfe6ff, 0x5f7d6a, .85); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffe0b0, 2.0); sun.position.set(-8,12,6); sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.01;
Object.assign(sun.shadow.camera,{left:-9,right:9,top:8,bottom:-8}); scene.add(sun);

// Bầu trời: gradient xanh + mây bông kiểu anime
const sky = new THREE.Mesh(new THREE.SphereGeometry(90,32,16), new THREE.ShaderMaterial({ side:THREE.BackSide, depthWrite:false, fog:false,
  uniforms:{uTime:{value:0}, uTop:{value:new THREE.Color()}, uHor:{value:new THREE.Color()}, uBelow:{value:new THREE.Color()},
    uCloudCol:{value:new THREE.Color()}, uCloudShade:{value:new THREE.Color()}, uStars:{value:0}, uCover:{value:0},
    uSunDir:{value:new THREE.Vector3(0,1,0)}, uSunCol:{value:new THREE.Color()}, uGlow:{value:0}},
  vertexShader:`varying vec3 vD; void main(){ vD=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader:`uniform float uTime,uStars,uCover,uGlow; uniform vec3 uTop,uHor,uBelow,uCloudCol,uCloudShade,uSunDir,uSunCol; varying vec3 vD;
    float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
    float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
    float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*n(p);p*=2.03;a*=.5;}return s;}
    void main(){ float y=max(vD.y,0.); float dn=clamp(-vD.y*3.,0.,1.);
      vec3 col=mix(uHor,uTop,pow(y,.55));
      float md=max(dot(vD,uSunDir),0.);
      col+=uSunCol*(pow(md,10.)*.35+pow(md,400.)*1.6)*uGlow;               // quầng mặt trời (rõ lúc hoàng hôn)
      vec2 p=vD.xz/(vD.y+.25)*1.6+vec2(uTime*.01,0.);
      float c=fbm(p); float cl=smoothstep(.5-uCover,.62-uCover,c)*smoothstep(.02,.25,vD.y);
      // sao + trăng ban đêm
      vec2 sp=vD.xz/(vD.y+.35)*90.; vec2 ci=floor(sp); float st=step(.985,h(ci))*smoothstep(.13,.0,length(fract(sp)-.5));
      col+=st*uStars*(1.-cl)*smoothstep(.05,.3,vD.y)*(.6+.4*sin(uTime*2.+h(ci)*40.));
      col=mix(col,vec3(1.,.97,.88)*1.5,smoothstep(.9990,.9993,dot(vD,uSunDir))*uStars);
      vec3 cloud=mix(uCloudShade,uCloudCol,smoothstep(.55,.75,c));        // mây 2 tông kiểu anime
      col=mix(col,cloud,cl);
      col=mix(col,uBelow,dn);
      gl_FragColor=vec4(col,1.);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`}));
scene.add(sky);

// ================= VẬT LIỆU ANIME =================
const toonRamp = (()=>{ const t=new THREE.DataTexture(new Uint8Array([140,140,140,255, 200,200,200,255, 255,255,255,255]),3,1);
  t.minFilter=t.magFilter=THREE.NearestFilter; t.needsUpdate=true; return t; })();
const toon = (o)=>new THREE.MeshToonMaterial({gradientMap:toonRamp,...o});
const outlineM = new THREE.MeshBasicMaterial({color:0x2a2a2e, side:THREE.BackSide});

function canvasTex(w,h,draw){ const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t; }
const rnd = (a,b)=>a+Math.random()*(b-a);

// Mái dốc đơn vị: đáy 1x1, cao 1, nóc chạy theo trục X
function gableGeometry(){
  const A=[-.5,0,.5],B=[.5,0,.5],C=[.5,1,0],D=[-.5,1,0],E=[-.5,0,-.5],F=[.5,0,-.5];
  const tris=[A,B,C, A,C,D, F,E,D, F,D,C, B,F,C, E,A,D];
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(tris.flat(),3)); g.computeVertexNormals(); return g;
}
// Tán cây dạng cụm mây (nhiều khối cầu ghép lại) - đặc trưng cây trong phim hoạt hình Nhật
function blobTreeGeometry(){
  const base=new THREE.IcosahedronGeometry(1,1);
  const parts=[[0,0,0,1],[.62,-.18,.22,.72],[-.55,-.12,-.28,.78],[.1,.42,-.12,.66],[-.2,-.2,.6,.6]]
    .map(([x,y,z,s])=>base.clone().scale(s,s*.9,s).translate(x,y,z));
  return mergeGeometries(parts).scale(.055,.055,.055);
}

const hotelFacade = canvasTex(128,96,(x,w,h)=>{
  x.fillStyle='#f5efe3'; x.fillRect(0,0,w,h);
  for(let f=0;f<3;f++){ const y=f*32;
    for(const wx of [8,68]){ x.fillStyle='#4d6b7a'; x.fillRect(wx,y+5,52,20);
      x.fillStyle='#8fb4c4'; x.fillRect(wx+2,y+6,10,8);                     // ánh phản chiếu kính kiểu anime
      x.fillStyle='#c2b49c'; for(let i=0;i<26;i+=5) x.fillRect(wx+26+i,y+5,2.5,20);   // lam màu be
      x.fillStyle='#f0e9dc'; x.fillRect(wx+24,y+5,2,20); }
    x.fillStyle='#968b7b'; x.fillRect(0,y+22,w,3);
    x.fillStyle='#d9d0c0'; x.fillRect(0,y+29,w,3);
  }
});
hotelFacade.wrapS = THREE.RepeatWrapping;
const hotelEnd = canvasTex(64,96,(x,w,h)=>{ x.fillStyle='#efe9dd'; x.fillRect(0,0,w,h);
  x.fillStyle='#d6cab4'; for(let i=0;i<w;i+=6) x.fillRect(i,0,4,h); x.fillStyle='#efe9dd'; x.fillRect(0,0,w,6); });
const woodFacade = canvasTex(128,128,(x,w,h)=>{             // ốp giả gỗ tông be trung tính
  for(let i=0;i<w;i+=8){ const l=rnd(76,83); x.fillStyle=`hsl(36,24%,${l}%)`; x.fillRect(i,0,8,h);
    x.fillStyle='rgba(110,95,75,.28)'; x.fillRect(i,0,1,h); }
  x.fillStyle='#f3ecdf'; x.fillRect(34,46,60,70); x.fillStyle='#3f5866'; x.fillRect(38,50,52,66);
  x.fillStyle='rgba(200,230,240,.55)'; x.fillRect(42,52,12,26);
  x.fillStyle='#f3ecdf'; x.fillRect(63,50,2,66);
});
// Lớp phát sáng cửa sổ ban đêm (đen = không sáng)
const hotelEmit = canvasTex(128,96,(x,w,h)=>{ x.fillStyle='#000'; x.fillRect(0,0,w,h);

  seedPts.forEach(([g,u,v,s],i)=>{ g.updateMatrixWorld(); const k=s*rnd(.8,1.25);
    wp.set(u,.004,v).applyMatrix4(g.matrixWorld); m4.makeTranslation(wp.x,.004,wp.z); iPot.setMatrixAt(i,m4);
    m4.compose(wp.setY(.012*k),q.identity(),new THREE.Vector3(k,k*1.1,k)); iSeed.setMatrixAt(i,m4);
    iSeed.setColorAt(i,col.setHSL(rnd(.24,.32),rnd(.5,.7),rnd(.38,.55))); });
  iSeed.castShadow=true; scene.add(iSeed,iPot);

  // --- Cầu gỗ qua suối: tự tìm hướng dòng chảy, đặt cầu vuông góc ---
  const deckM=toon({color:0xb89c78}), railM=toon({color:0x8d7356}), bridgePx=[];
  for(const [bx,by] of BRIDGES){
    let best=null, bd=1e9;                                                 // pixel nước gần nhất
    for(let y=by-30;y<=by+30;y++) for(let x=bx-30;x<=bx+30;x++) if(isWater[y*W+x]){ const dd=(x-bx)**2+(y-by)**2; if(dd<bd){bd=dd;best=[x,y];} }
    if(!best) continue;
    let sx=0,sy=0,c=0; const P=[];
    for(let y=best[1]-25;y<=best[1]+25;y++) for(let x=best[0]-25;x<=best[0]+25;x++) if(isWater[y*W+x]){ P.push([x,y]); sx+=x; sy+=y; c++; }
    const mx=sx/c, my=sy/c; let a=0,b=0,cxy=0; for(const [x,y] of P){ a+=(x-mx)**2; b+=(y-my)**2; cxy+=(x-mx)*(y-my); }
    const flow=.5*Math.atan2(2*cxy,a-b), ang=flow+Math.PI/2, dx=Math.cos(ang), dy=Math.sin(ang);
    let w0=0,w1=0; while(w0<40 && isWater[Math.round(my-dy*w0)*W+Math.round(mx-dx*w0)]) w0++;
    while(w1<40 && isWater[Math.round(my+dy*w1)*W+Math.round(mx+dx*w1)]) w1++;
    const cx=mx+dx*(w1-w0)/2, cy=my+dy*(w1-w0)/2, span=Math.max(.3,(w0+w1+24)*MW/W);
    const g=new THREE.Group(); g.position.copy(imgToWorld(cx,cy)); g.rotation.y=-ang; g.name='bridge'; scene.add(g); bridgePx.push([cx,cy]);
    const seg=9, rise=.03, DW=.065;
    for(let i=0;i<seg;i++){                                                // mặt cầu cong nhẹ
      const t0=i/seg, t1=(i+1)/seg, x0=(t0-.5)*span, x1=(t1-.5)*span;
      const y0=Math.sin(t0*Math.PI)*rise+.012, y1=Math.sin(t1*Math.PI)*rise+.012, len=Math.hypot(x1-x0,y1-y0);
      const d=new THREE.Mesh(new THREE.BoxGeometry(len,.006,DW),deckM);
      d.position.set((x0+x1)/2,(y0+y1)/2,0); d.rotation.z=Math.atan2(y1-y0,x1-x0); d.castShadow=d.receiveShadow=true; g.add(d);
      for(const side of [-1,1]){
        const r=new THREE.Mesh(new THREE.BoxGeometry(len,.004,.004),railM);
        r.position.set((x0+x1)/2,(y0+y1)/2+.03,side*DW/2); r.rotation.z=d.rotation.z; g.add(r);
        const p=new THREE.Mesh(new THREE.BoxGeometry(.005,.032,.005),railM);
        p.position.set(x0,y0+.016,side*DW/2); p.castShadow=true; g.add(p); } }
    for(const side of [-1,1]){ const p=new THREE.Mesh(new THREE.BoxGeometry(.005,.032,.005),railM); p.position.set(span/2,.028,side*DW/2); g.add(p); }
  }

  // --- Cây rừng: tán cụm mây, đổ bóng cel 3 tông ---
  const trees=[], step=Math.round(9*K), jit=3*K;
  for(let y=step;y<H-step;y+=step) for(let x=step;x<W-step;x+=step){ const jx=(x+rnd(-jit,jit))|0, jy=(y+rnd(-jit,jit))|0, i=jy*W+jx;
    const g=d[i*4+1]; if(isGreen[i] && g<165 && Math.random()<.38 && !bridgePx.some(([bx,by])=>(jx-bx)**2+(jy-by)**2<38*38)) trees.push([jx,jy,g]); }
  const iC=new THREE.InstancedMesh(blobTreeGeometry(), toon({}), trees.length);
  const iT=new THREE.InstancedMesh(new THREE.CylinderGeometry(.011,.018,.1,5), toon({color:0x6b4a32}), trees.length);
  trees.forEach(([x,y,g],i)=>{ const p=imgToWorld(x,y), s=rnd(.65,1.25);
    m4.compose(p.clone().setY(.13*s), q.setFromEuler(new THREE.Euler(0,rnd(0,6),0)), new THREE.Vector3(s,s*1.05,s)); iC.setMatrixAt(i,m4);
    m4.makeTranslation(p.x,.05*s,p.z); iT.setMatrixAt(i,m4);
    col.setHSL(rnd(.24,.34), rnd(.45,.62), .32+(g/255)*.2); iC.setColorAt(i,col); });
  iC.castShadow=iC.receiveShadow=true; scene.add(iC,iT);

  // --- Bụi cây ven đường + đèn lồng gỗ ---
  const shrubs=[], lamps=[], pr=1/(K*K);
  for(let k=0;k<roadEdge.length;k+=2){ const r=Math.random(); if(r<.035*pr) shrubs.push(k); else if(r<.04*pr) lamps.push(k); }
  const iS=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(.03,1), toon({}), shrubs.length);
  shrubs.forEach((k,i)=>{ const p=imgToWorld(roadEdge[k],roadEdge[k+1]), s=rnd(.7,1.4);
    m4.compose(p.setY(.018*s), q.identity(), new THREE.Vector3(s,s*.75,s)); iS.setMatrixAt(i,m4);
    col.setHSL(rnd(.22,.32),rnd(.45,.6),rnd(.32,.45)); iS.setColorAt(i,col); });
  iS.castShadow=true; scene.add(iS);
  const iP=new THREE.InstancedMesh(new THREE.CylinderGeometry(.004,.005,.07,4), toon({color:0x4a3322}), lamps.length);
  lampMat=new THREE.MeshBasicMaterial({color:0xffd9a0});
  glowMat=new THREE.MeshBasicMaterial({map:glowTex, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, opacity:0});
  const iL=new THREE.InstancedMesh(new THREE.BoxGeometry(.016,.018,.016), lampMat, lamps.length);
  const iG=new THREE.InstancedMesh(new THREE.PlaneGeometry(.22,.22).rotateX(-Math.PI/2), glowMat, lamps.length);   // quầng sáng hắt xuống đất
  lamps.forEach((k,i)=>{ const p=imgToWorld(roadEdge[k],roadEdge[k+1]);
    m4.makeTranslation(p.x,.035,p.z); iP.setMatrixAt(i,m4); m4.makeTranslation(p.x,.075,p.z); iL.setMatrixAt(i,m4);
    m4.makeTranslation(p.x,.012,p.z); iG.setMatrixAt(i,m4); });
  iG.renderOrder=3; scene.add(iP,iL,iG);

  // --- Đom đóm ban đêm: bay lơ lửng trên các tán cây ---
  const FF=500, ffPos=new Float32Array(FF*3), ffPh=new Float32Array(FF);
  for(let i=0;i<FF;i++){ const [x,y]=trees[(Math.random()*trees.length)|0]||[W/2,H/2], p=imgToWorld(x,y);
    ffPos.set([p.x+rnd(-.1,.1), rnd(.05,.3), p.z+rnd(-.1,.1)], i*3); ffPh[i]=Math.random()*100; }
  const ffGeo=new THREE.BufferGeometry(); ffGeo.setAttribute('position',new THREE.BufferAttribute(ffPos,3)); ffGeo.setAttribute('aPh',new THREE.BufferAttribute(ffPh,1));
  fireflyMat=new THREE.ShaderMaterial({ transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, uniforms:{uTime:{value:0}, uAmt:{value:0}, uPx:{value:renderer.getPixelRatio()}},
    vertexShader:`uniform float uTime,uPx; attribute float aPh; varying float vB;
      void main(){ vec3 p=position+vec3(sin(uTime*.6+aPh)*.05, sin(uTime*.9+aPh*1.7)*.03, cos(uTime*.5+aPh)*.05);
        vec4 mv=modelViewMatrix*vec4(p,1.); gl_Position=projectionMatrix*mv;
        vB=pow(.5+.5*sin(uTime*2.2+aPh*3.1),3.); gl_PointSize=min(uPx*60./-mv.z, 9.*uPx); }`,
    fragmentShader:`uniform float uAmt; varying float vB;
      void main(){ float d=length(gl_PointCoord-.5); float a=smoothstep(.5,0.,d);
        gl_FragColor=vec4(vec3(.85,1.,.45)*2.2, a*vB*uAmt); }`});
  const ff=new THREE.Points(ffGeo,fireflyMat); ff.renderOrder=4; scene.add(ff);

  // --- Bãi đỗ xe (vùng caro số 6 trên mặt bằng) - tọa độ px ảnh nền ---
  const LOTS=[[1137,411,1230,482],[534,559,613,638],[1228,956,1303,980],[1224,981,1301,1041]];
  const SW=.042, SD=.075, AISLE=.085, PX=600, carPos=[];
  for(const [x0,y0,x1,y1] of LOTS){
    const a=imgToWorld(x0,y0), b=imgToWorld(x1,y1), w=b.x-a.x, dp=b.z-a.z, nc=Math.floor((w-.02)/SW);
    const rows=[]; let z=.012;
    while(z+SD<=dp-.008){ rows.push([z,1]); z+=SD; if(z+SD<=dp-.008){ rows.push([z,-1]); z+=SD; } z+=AISLE; }
    const tex=canvasTex(Math.round(w*PX),Math.round(dp*PX),(x,cw,chh)=>{
      x.fillStyle='#c4c7c3'; x.fillRect(0,0,cw,chh);
      for(let i=0;i<cw*chh/40;i++){ x.fillStyle=`rgba(0,0,0,${Math.random()*.05})`; x.fillRect(Math.random()*cw,Math.random()*chh,2,2); }
      x.strokeStyle='#e0ddd2'; x.lineWidth=4; x.strokeRect(2,2,cw-4,chh-4);
      x.fillStyle='#fbfaf5';
      for(const [rz] of rows){ for(let c=0;c<=nc;c++) x.fillRect((.01+c*SW)*PX-1.5,rz*PX,3,SD*PX); }
    });
    const lot=new THREE.Mesh(new THREE.PlaneGeometry(w,dp),new THREE.MeshLambertMaterial({map:tex}));
    lot.rotation.x=-Math.PI/2; lot.position.set(a.x+w/2,.004,a.z+dp/2); lot.receiveShadow=true; scene.add(lot);
    for(const [rz,dir] of rows) for(let c=0;c<nc;c++) if(Math.random()<.7)
      carPos.push([a.x+.01+(c+.5)*SW, a.z+rz+SD/2, dir]);
  }
  const CAR_COL=[0xf4f1ea,0xf4f1ea,0xc9cdd2,0x3d4a52,0xc8524c,0x5079b3,0xe6c35a,0x7aa37a];
  const iCar=new THREE.InstancedMesh(new THREE.BoxGeometry(.026,.016,.054), toon({}), carPos.length);
  const iCab=new THREE.InstancedMesh(new THREE.BoxGeometry(.022,.013,.028), toon({color:0x46525c}), carPos.length);
  carPos.forEach(([x,z,dir],i)=>{
    m4.makeTranslation(x,.011,z); iCar.setMatrixAt(i,m4);
    m4.makeTranslation(x,.024,z+dir*.004); iCab.setMatrixAt(i,m4);
    iCar.setColorAt(i,col.setHex(CAR_COL[(Math.random()*CAR_COL.length)|0])); });
  iCar.castShadow=iCab.castShadow=true; scene.add(iCar,iCab);

  document.getElementById('loading').remove();
};

// ================= KHÍ QUYỂN: NGÀY / HOÀNG HÔN / ĐÊM + THỜI TIẾT =================
const C=(h)=>new THREE.Color(h), RGB=(r,g,b)=>new THREE.Color(r,g,b);
const PRESETS={
  day:   {sunPos:new THREE.Vector3(-8,12,6), sunCol:C(0xffe0b0), sunI:2.0, hemiSky:C(0xcfe6ff), hemiGnd:C(0x5f7d6a), hemiI:.85,
          skyTop:RGB(.42,.68,.92), skyHor:RGB(.98,.92,.82), skyBelow:RGB(.62,.80,.86), cloud:RGB(1,1,1), cloudShade:RGB(.80,.84,.92),
          exp:.95, glow:.25, lamp:0, win:0, water:1, stars:0, shadowAmt:.22},
  sunset:{sunPos:new THREE.Vector3(-13,3.2,5), sunCol:C(0xff9150), sunI:2.3, hemiSky:C(0xffc49a), hemiGnd:C(0x4c5468), hemiI:.7,
          skyTop:RGB(.30,.38,.70), skyHor:RGB(1,.58,.34), skyBelow:RGB(.80,.58,.55), cloud:RGB(1,.78,.62), cloudShade:RGB(.62,.45,.62),
          exp:1.0, glow:1.3, lamp:.55, win:.45, water:.8, stars:0, shadowAmt:.12},
  night: {sunPos:new THREE.Vector3(7,11,-5), sunCol:C(0x9db4ff), sunI:.55, hemiSky:C(0x34487a), hemiGnd:C(0x0f161c), hemiI:.5,
          skyTop:RGB(.015,.03,.10), skyHor:RGB(.08,.13,.28), skyBelow:RGB(.05,.08,.16), cloud:RGB(.22,.26,.38), cloudShade:RGB(.10,.12,.2),
          exp:1.15, glow:0, lamp:1, win:1, water:.2, stars:1, shadowAmt:.05}
};
const cur={}; for(const k in PRESETS.day){ const v=PRESETS.day[k]; cur[k]=v.clone?v.clone():v; }
let timeMode='day', wx='clear', wR=0, wM=0;
const GRAY=RGB(.5,.55,.6), MISTC=RGB(.86,.89,.91), WHITE=RGB(1,1,1), tGray=new THREE.Color(), tMist=new THREE.Color();

// Mưa: các vệt nước rơi xiên
const RN=2500, rainPos=new Float32Array(RN*6), rainSpd=new Float32Array(RN);
for(let i=0;i<RN;i++){ const x=rnd(-MW/2,MW/2), z=rnd(-MH/2,MH/2), y=rnd(0,5); rainPos.set([x,y,z,x+.02,y+.12,z],i*6); rainSpd[i]=rnd(5,7); }
const rainGeo=new THREE.BufferGeometry(); rainGeo.setAttribute('position',new THREE.BufferAttribute(rainPos,3));
const rainMat=new THREE.LineBasicMaterial({color:0xcfdcea, transparent:true, opacity:0, depthWrite:false});
const rain=new THREE.LineSegments(rainGeo,rainMat); rain.frustumCulled=false; rain.visible=false; scene.add(rain);

function applyAtmos(dt,t){
  const k=1-Math.exp(-dt*1.8), T=PRESETS[timeMode];
  for(const key in cur){ const tv=T[key]; if(typeof tv==='number') cur[key]+=(tv-cur[key])*k; else cur[key].lerp(tv,k); }
  wR+=((wx==='rain'?1:0)-wR)*k; wM+=((wx==='mist'?1:0)-wM)*k;
  sun.position.copy(cur.sunPos); sun.color.copy(cur.sunCol); sun.intensity=cur.sunI*(1-.65*wR)*(1-.35*wM);
  hemi.color.copy(cur.hemiSky); hemi.groundColor.copy(cur.hemiGnd); hemi.intensity=cur.hemiI*(1-.1*wR);
  const lum=cur.skyHor.r*.3+cur.skyHor.g*.59+cur.skyHor.b*.11;
  tGray.copy(GRAY).multiplyScalar(lum*1.1+.05); tMist.copy(MISTC).multiplyScalar(lum+.08);
  const u=sky.material.uniforms;
  u.uTop.value.copy(cur.skyTop).lerp(tGray,.65*wR).lerp(tMist,.5*wM);
  u.uHor.value.copy(cur.skyHor).lerp(tGray,.6*wR).lerp(tMist,.6*wM);
  u.uBelow.value.copy(cur.skyBelow).lerp(tGray,.6*wR).lerp(tMist,.7*wM);
  u.uCloudCol.value.copy(cur.cloud).lerp(tGray,.5*wR);
  u.uCloudShade.value.copy(cur.cloudShade).lerp(tGray,.5*wR).multiplyScalar(1-.3*wR);
  u.uStars.value=cur.stars*(1-wR)*(1-.6*wM); u.uCover.value=.18*wR+.05*wM;
  u.uSunDir.value.copy(cur.sunPos).normalize(); u.uSunCol.value.copy(cur.sunCol); u.uGlow.value=cur.glow*(1-wR)*(1-.5*wM);
  u.uTime.value=t;
  scene.fog.color.copy(u.uBelow.value);                                 // sương hòa vào nền trời
  scene.fog.near=24-14*wR-20*wM; scene.fog.far=52-18*wR-30*wM;
  renderer.toneMappingExposure=cur.exp;
  document.body.classList.toggle('night',cur.stars>.5);
  if(lampMat){ lampMat.color.setRGB(1,.85,.63).multiplyScalar(1+3.5*cur.lamp); glowMat.opacity=.85*cur.lamp; }
  for(const m of winMats) m.emissiveIntensity=cur.win*1.4;
  if(waterMat){ const w=waterMat.uniforms; w.uTime.value=t; w.uDim.value=cur.water*(1-.25*wR); w.uSkyC.value.copy(u.uHor.value);
    w.uSpecC.value.copy(cur.sunCol).multiplyScalar(1-.8*wR); w.uSun.value.copy(u.uSunDir.value); w.uRain.value=wR; }
  if(cloudMat){ cloudMat.uniforms.uTime.value=t; cloudMat.uniforms.uAmt.value=cur.shadowAmt*(1-.5*wM)+.08*wR; }
  for(const m of mistMats){ m.uniforms.uTime.value=t; m.uniforms.uAmt.value=.55*wM+.1*wR; m.uniforms.uCol.value.copy(u.uHor.value).lerp(WHITE,.25); }
  if(fireflyMat){ fireflyMat.uniforms.uTime.value=t; fireflyMat.uniforms.uAmt.value=cur.stars*(1-wR)*(1-.3*wM); }
  rain.visible=wR>.01;
  if(rain.visible){ rainMat.opacity=.45*wR;
    for(let i=0;i<RN;i++){ let y=rainPos[i*6+1]-rainSpd[i]*dt; if(y<0) y+=5; rainPos[i*6+1]=y; rainPos[i*6+4]=y+.12; }
    rainGeo.attributes.position.needsUpdate=true; }
  if(AC) audioTick();
}

  g.querySelectorAll('button').forEach(b=>b.onclick=()=>{ g.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); fn(b.dataset.v); }); }

// ================= ÂM THANH: nhạc nền tự sinh (Web Audio) + tiếng thiên nhiên =================
let AC=null, master, verb, dry, rainGain, musicOn=false, nextChord=0, nextNote=0, nextAmb=0, chordIdx=0;
const mtof=m=>440*Math.pow(2,(m-69)/12);
const CHORDS=[[53,57,60,64],[55,59,62,64],[52,55,59,62],[57,60,64,67]];   // Fmaj7 - G6 - Em7 - Am7 (giai điệu nhẹ kiểu phim hoạt hình)
const SCALE=[72,74,76,79,81,84,86];
function initAudio(){
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain(); master.gain.value=0; master.connect(AC.destination);
  verb=AC.createConvolver(); const len=AC.sampleRate*3.5, ir=AC.createBuffer(2,len,AC.sampleRate);
  for(let c=0;c<2;c++){ const ch=ir.getChannelData(c); for(let i=0;i<len;i++) ch[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.5); }
  verb.buffer=ir; const vg=AC.createGain(); vg.gain.value=.5; verb.connect(vg).connect(master);
  dry=AC.createGain(); dry.gain.value=.6; dry.connect(master);
  const nb=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate), nd=nb.getChannelData(0); for(let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
  const ns=AC.createBufferSource(); ns.buffer=nb; ns.loop=true;
  const hp=AC.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=400;
  const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2500;
  rainGain=AC.createGain(); rainGain.gain.value=0; ns.connect(hp).connect(lp).connect(rainGain).connect(master); ns.start();
}
function pad(notes,t,dur){ for(const m of notes) for(const det of [-7,7]){
  const o=AC.createOscillator(); o.type='triangle'; o.frequency.value=mtof(m); o.detune.value=det;
  const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1100;
  const g=AC.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.018,t+1.8);
  g.gain.setValueAtTime(.018,t+dur-.4); g.gain.linearRampToValueAtTime(0,t+dur+2.5);
  o.connect(f).connect(g); g.connect(verb); g.connect(dry); o.start(t); o.stop(t+dur+2.6); } }
function pluck(m,t,v){ const o=AC.createOscillator(), o2=AC.createOscillator(), g=AC.createGain(), g2=AC.createGain();
  o.type='sine'; o.frequency.value=mtof(m); o2.type='triangle'; o2.frequency.value=mtof(m)*2; g2.gain.value=.2;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.01); g.gain.exponentialRampToValueAtTime(.0005,t+2.4);
  o.connect(g); o2.connect(g2).connect(g); g.connect(verb); g.connect(dry); o.start(t); o2.start(t); o.stop(t+2.5); o2.stop(t+2.5); }
function bird(t){ const n=2+(Math.random()*3|0), base=rnd(2400,3600);
  for(let i=0;i<n;i++){ const s=t+i*rnd(.09,.14), o=AC.createOscillator(), g=AC.createGain();
    o.frequency.setValueAtTime(base,s); o.frequency.exponentialRampToValueAtTime(base*rnd(1.3,1.7),s+.07);
    g.gain.setValueAtTime(0,s); g.gain.linearRampToValueAtTime(.015,s+.01); g.gain.exponentialRampToValueAtTime(.0005,s+.09);
    o.connect(g); g.connect(verb); g.connect(dry); o.start(s); o.stop(s+.1); } }
function cricket(t){ const o=AC.createOscillator(), g=AC.createGain(); o.frequency.value=rnd(4300,4900);
  g.gain.setValueAtTime(0,t); for(let i=0;i<8;i++){ const s=t+i*.045; g.gain.setValueAtTime(.009,s); g.gain.setValueAtTime(0,s+.025); }
  o.connect(g); g.connect(dry); o.start(t); o.stop(t+.4); }
function audioTick(){
  const now=AC.currentTime;
  rainGain.gain.setTargetAtTime(.2*wR,now,.6);
  if(!musicOn) return;
  while(nextChord<now+.3){ pad(CHORDS[chordIdx%4],nextChord,4); chordIdx++; nextChord+=4; }
  while(nextNote<now+.3){ if(Math.random()<.7) pluck(SCALE[(Math.random()*SCALE.length)|0],nextNote,.045*(1-.35*cur.stars)*(1-.4*wR));
    nextNote+=[.5,.5,1,1,1.5][(Math.random()*5)|0]; }
  while(nextAmb<now+.3){ if(wR<.5){ if(cur.stars>.5) cricket(nextAmb); else bird(nextAmb); } nextAmb+=rnd(1.2,4.5); }
}
document.getElementById('music').onclick=(e)=>{
  if(!AC) initAudio(); AC.resume(); musicOn=!musicOn;
  if(musicOn){ const t=AC.currentTime+.1; nextChord=nextNote=nextAmb=t; }
  master.gain.setTargetAtTime(musicOn?.55:0,AC.currentTime,.4);
  e.currentTarget.classList.toggle('on',musicOn);
  e.currentTarget.textContent=musicOn?'♪ Tắt nhạc & âm thanh':'♪ Bật nhạc & âm thanh';
};

// ================= PIN: phân khu & số =================
const pins = PINS.map(([k,x,y,named])=>{
  const zone=typeof k==='string', el=document.createElement('div');
  el.className='pin'+(zone?' zone':'');
  el.innerHTML = zone ? `<b>${k}</b>${named?`<span>${ZONE_SHORT[k]}</span>`:''}` : `${k}<div class="tip">${LEGEND[k]}</div>`;
  document.getElementById('pins').append(el);
  const pos=toWorld(x,y).setY(zone?.45:.3); el.onclick=()=>focus(pos,k,zone); return {el,pos,zone};
});
let fly=null;
function flyTo(pos,tgt){ fly={p0:camera.position.clone(),t0:controls.target.clone(),p1:pos,t1:tgt,t:0}; }
function focus(p,k,zone){
  const off = zone ? new THREE.Vector3(2,3.4,3.8) : new THREE.Vector3(1.4,2.2,2.6);
  flyTo(p.clone().setY(0).add(off), p.clone().setY(0));
  document.getElementById('ct').textContent = zone ? 'Phân khu '+k : 'Hạng mục '+k;
  document.getElementById('cd').textContent = LEGEND[k];
  document.getElementById('card').classList.add('show');
}
window.__look=(px,py,d=1)=>{ const p=toWorld(px,py); flyTo(p.clone().add(new THREE.Vector3(1.1,1.7,2).multiplyScalar(d)),p); };   // gỡ lỗi: bay tới tọa độ ảnh có ghi chú
document.getElementById('back').onclick=()=>{ flyTo(HOME.pos.clone(),HOME.tgt.clone()); document.getElementById('card').classList.remove('show'); };

// ================= VÒNG LẶP =================
const v=new THREE.Vector3(), clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),.1);
  if(fly){ fly.t=Math.min(1,fly.t+dt/1.6); const e=1-Math.pow(1-fly.t,3);
    camera.position.lerpVectors(fly.p0,fly.p1,e); controls.target.lerpVectors(fly.t0,fly.t1,e); if(fly.t>=1) fly=null; }
  controls.update();
  applyAtmos(dt,clock.elapsedTime);
  composer.render();
  // Toàn cảnh: chỉ hiện tên phân khu. Đến gần: hiện số các công trình quanh điểm đang nhìn
  const camDist=camera.position.distanceTo(controls.target), overview=camDist>8.5, radius=.5*camDist+.6;
  for(const p of pins){ v.copy(p.pos).project(camera);
    let on = p.zone ? overview : (!overview && Math.hypot(p.pos.x-controls.target.x,p.pos.z-controls.target.z)<radius);
    if(v.z>1) on=false;
    p.el.classList.toggle('on',on);
    p.el.style.transform=`translate(${(v.x*.5+.5)*innerWidth}px,${(-v.y*.5+.5)*innerHeight}px) translate(-50%,-100%)`; }
});
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight); });
</script>
